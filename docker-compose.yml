services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_local_pw
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - "6379"

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=5c13308d4b02e2ddf4ef54e6d7ae7c382801445339ca92d2
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_local_pw@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
    volumes:
      - evolution-data:/evolution/instances
    depends_on:
      - postgres
      - redis

  # agente-ia-core roda local via venv (ver README) -- build via Docker
  # hitting instabilidade real de rede pro PyPI hoje. Evolution API não
  # precisa disso (imagem pronta, sem pip install).
  agente-ia-core:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./agents:/app/agents
    depends_on:
      - evolution-api
    profiles:
      - full-docker

volumes:
  evolution-data:
  postgres-data:
