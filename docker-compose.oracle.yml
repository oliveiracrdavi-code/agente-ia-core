# Stack pra rodar na VM Oracle (Always Free, 4 OCPU / 24GB RAM) -- sempre
# ativa, sem dormir. Postgres continua no Supabase (já configurado, sem
# custo) em vez de rodar local -- simplifica e deixa mais RAM livre pra
# quando o dashboard e o criador de SaaS forem hospedados aqui também.
#
# Rodar: docker compose -f docker-compose.oracle.yml up -d --build

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_ADMIN_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${SUPABASE_DB_URL}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
    volumes:
      - evolution-data:/evolution/instances

  agente-ia-core:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      - EVOLUTION_ADMIN_API_KEY=${EVOLUTION_ADMIN_API_KEY}
      - EVOLUTION_BASE_URL=http://evolution-api:8080
      - WEBHOOK_BASE_URL=http://agente-ia-core:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY}
      - CORS_ALLOW_ORIGIN_REGEX=${CORS_ALLOW_ORIGIN_REGEX}
    volumes:
      - ./agents:/app/agents
    depends_on:
      - evolution-api

  # saas-creator-core -- claude CLI dentro do container precisa de login
  # próprio (não herda a sessão interativa do Windows); ~/.claude na VM
  # fica em volume nomeado pra sobreviver a rebuild/restart do container.
  saas-creator-core:
    build: ../saas-creator-core
    restart: always
    ports:
      - "8500:8500"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL}
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY}
      - CORS_ALLOW_ORIGIN_REGEX=${CORS_ALLOW_ORIGIN_REGEX}
    volumes:
      # dados reais dos 14 projetos já criados -- é o que "não pode se
      # perder" na migração, então bind mount num diretório que o rsync
      # da transferência escreve direto, não um volume anônimo do Docker.
      - ./saas-projects:/app/saas-projects
      - ./saas-creator-core-state/clientes_notas.json:/app/clientes_notas.json
      - ./saas-creator-core-state/cost_log.md:/app/cost_log.md
      - claude-cli-auth:/root/.claude

  # super-dashboard -- Next.js standalone, precisa dos NEXT_PUBLIC_* como
  # build-arg (embutido no bundle em build time, ver Dockerfile).
  super-dashboard:
    build:
      context: ../super-dashboard
      args:
        NEXT_PUBLIC_AGENT_API_URL: http://${VM_PUBLIC_IP}:8000
        NEXT_PUBLIC_SAAS_CREATOR_URL: http://${VM_PUBLIC_IP}:8500
        NEXT_PUBLIC_AGENTE_CORE_URL: http://${VM_PUBLIC_IP}:8000
        NEXT_PUBLIC_DASHBOARD_API_KEY: ${DASHBOARD_API_KEY}
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - agente-ia-core
      - saas-creator-core

volumes:
  evolution-data:
  claude-cli-auth:
